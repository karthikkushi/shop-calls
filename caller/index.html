<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#236bc0"><meta name="robots" content="noindex,nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Shop Calls">
  <title>Shop Calls · Fieldwork</title>
  <link rel="icon" href="./icon.svg"><link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css"><script src="./config.js"></script><script type="module" src="./app.js"></script>
</head>
<body>
  <section id="login" class="login"><img src="./icon.svg" alt="" width="64" height="64"><h1>Shop Calls</h1><p>Your shop contacts.<br>Your next conversation.</p><form id="login-form"><label>Caller access code<input name="code" type="password" autocomplete="current-password" required></label><label>Your name<input name="caller" autocomplete="name" maxlength="100" required></label><button class="primary">Open my leads</button></form><p id="login-error" role="alert"></p></section>
  <div id="app" hidden>
    <header><a class="brand" href="./"><img src="./icon.svg" width="32" height="32" alt="">Shop Calls</a><button id="logout" class="quiet">Sign out</button></header>
    <main><div class="page-title"><div><p id="greeting"></p><h1 id="title">Shops to call</h1></div><button id="refresh" class="quiet" aria-label="Refresh leads">Refresh</button></div>
      <div class="pipeline" id="counts" aria-label="Calling progress"></div>
      <p id="message" class="message" role="status" hidden></p>
      <div class="filters"><label>Country<select id="country"><option value="">All countries</option></select></label><label>Category<select id="category"><option value="">All products</option><option value="desk">Desk organisation</option><option value="pet">Pet grooming</option><option value="home">Home storage</option><option value="travel">Travel organisation</option><option value="phone">Phone accessories</option></select></label></div>
      <label class="search-label">Find a shop<input id="search" type="search" placeholder="Shop name or city"></label>
      <div id="leads"></div><p class="attribution">Public business contacts; buying interest unconfirmed.<br>Map data: © OpenStreetMap contributors / Overture Maps.</p>
    </main>
    <nav class="tabs" aria-label="Call lists"><button data-tab="queue" class="active">To call</button><button data-tab="followup">Follow-ups</button><button data-tab="results">Responses</button><button data-tab="all">All shops</button></nav>
  </div>
  <dialog id="outcome"><form id="outcome-form"><div class="sheet-head"><h2 id="shop-title"></h2><button type="button" id="close" class="quiet" aria-label="Close outcome form">Close</button></div>
    <label>Shop response<select name="status" id="outcome-status"><option value="interested">Interested</option><option value="not_interested">Not interested</option><option value="no_answer">No answer</option><option value="callback">Call back later</option><option value="booking_requested">Booking requested</option><option value="do_not_contact">Do not contact again</option></select></label>
    <div id="booking-fields" hidden><label>Product wanted<input name="product" maxlength="200" list="products" placeholder="What exactly does the shop want?"><datalist id="products"></datalist></label><label>Quantity<input name="quantity" type="number" min="1" max="1000000" step="1" inputmode="numeric"></label><div class="filters"><label>Target price / unit<input name="target_unit_price" type="number" min="0" max="10000000" step="0.01" inputmode="decimal"></label><label>Currency<select name="currency"><option>USD</option><option>GBP</option><option>EUR</option><option>CAD</option><option>AUD</option><option>NZD</option><option>SGD</option><option>ZAR</option><option>INR</option></select></label></div><p class="hint">Records a request for your dashboard. Payment and supplier order are still pending.</p></div>
    <label id="followup-label" hidden>When to call back<input name="followup" type="datetime-local"></label>
    <label>Notes<textarea name="notes" rows="3" maxlength="2500" placeholder="Needs, buyer name, quantity, agreed next step…"></textarea></label>
    <p id="save-error" role="alert"></p><button class="primary" id="save">Save response</button>
  </form></dialog>
</body></html>
